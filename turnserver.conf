# coturn — STUN/TURN для звонков тьютор-ученик (аудио, WebRTC P2P).
# Секрет (--static-auth-secret) и внешний IP (--external-ip) передаются через
# CLI-флаги в docker-compose.yml (${TURN_SECRET}/${TURN_EXTERNAL_IP} из .env),
# не хранятся в этом файле — он закоммичен в публичный репозиторий.

listening-port=3478
min-port=49160
max-port=49260
realm=informatika.meteopavel.space

# REST API / time-limited credentials (username="<expiry>:<label>",
# credential = HMAC-SHA1(secret, username)) — секрет передаётся отдельным
# CLI-флагом, см. docker-compose.yml.
use-auth-secret

# TLS-порт (5349, TURNS) сознательно не поднимаем — нет сертификата под
# coturn отдельно от Caddy. STUN/TURN по обычным UDP/TCP закрывает
# подавляющее большинство сетей; TURNS нужен только в сильно зарежимленных
# сетях (гостиничный/корпоративный DPI) — не первоочередной случай для двух
# человек. Если понадобится — заводить отдельно.
no-tls
no-dtls

# Не нужен CLI-порт управления (5766) — не используем.
no-cli

fingerprint
stale-nonce=600

# Не даём релею стучаться во внутренние/зарезервированные сети — иначе
# публичный TURN превращается в инструмент для SSRF/сканирования локалки.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
