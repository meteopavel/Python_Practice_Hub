services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - EXECUTOR_URL=${EXECUTOR_URL}
      - TUTOR_LLM_URL=${TUTOR_LLM_URL:-http://10.0.0.1:8011}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_URLS=${TURN_URLS}
      - STUN_URLS=${STUN_URLS}
    expose:
      - "8000"

  # STUN/TURN для аудиозвонков (WebRTC, тьютор <-> ученик). host-networking —
  # рекомендованный для coturn режим: иначе Docker NAT путает внешний IP,
  # который STUN/TURN обязаны сообщать клиентам. Порты 3478 (tcp+udp) и
  # диапазон релея (min-port..max-port из turnserver.conf) должны быть
  # открыты на файрволе хоста отдельно — coturn ими управляет сам, Docker
  # port-publish тут ни при чём (host-режим).
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET}
      --external-ip=${TURN_EXTERNAL_IP}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
