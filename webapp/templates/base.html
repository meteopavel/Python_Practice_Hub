<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Доброкод{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/reset.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/workspace.css">
<link rel="stylesheet" href="/static/css/hints.css">
<link rel="stylesheet" href="/static/css/pages.css">
<link rel="stylesheet" href="/static/css/responsive.css">
{% block styles %}{% endblock %}
</head>
<body>
{% block header %}
<header class="app-header">
  <a class="brand" href="/"><span class="brand-mark">&lt;/&gt;</span> Доброкод</a>
  {% block header_left %}{% endblock %}
  <div class="header-spacer"></div>
  <details class="account-menu">
    <summary class="account-trigger">
      <span class="muted" id="username"></span>
      <span class="avatar" id="avatar"></span>
    </summary>
    <div class="account-menu-panel">
      <button class="account-menu-item" type="button" id="change-password-toggle">Сменить пароль</button>
      <form id="change-password-form" class="account-menu-form is-hidden">
        <div class="field">
          <label class="label" for="pw-current">Текущий пароль</label>
          <input class="input" id="pw-current" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label class="label" for="pw-new">Новый пароль</label>
          <input class="input" id="pw-new" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label class="label" for="pw-repeat">Повторите новый</label>
          <input class="input" id="pw-repeat" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <p class="field-error is-hidden m-0" id="change-password-error"></p>
        <div class="row gap-2">
          <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
          <button class="btn btn-sm" type="button" id="change-password-cancel">Отмена</button>
        </div>
      </form>
      <div class="account-menu-divider"></div>
      <form method="post" action="/logout" class="m-0">
        <button class="account-menu-item" type="submit">Выйти</button>
      </form>
    </div>
  </details>
</header>
{% endblock %}

{% block content %}{% endblock %}

<!-- Общий обработчик: клик вне открытой выпадашки аккаунта закрывает её.
     Раньше был продублирован inline в tutor/tutor_hints/tutor_student и
     отсутствовал в index/materials; теперь — в js/shared/app.js (один источник). -->
<script src="/static/js/lib/dom-utils.js"></script>
<script src="/static/js/shared/app.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
