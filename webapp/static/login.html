<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — Python Practice Hub</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; margin-top: 4px; }
  button { width: 100%; padding: 10px; margin-top: 20px; cursor: pointer; }
  .error { color: #b00020; margin-top: 12px; }
</style>
</head>
<body>
<h1>Вход</h1>
<form method="post" action="/login">
  <label>Логин
    <input type="text" name="username" autocomplete="username" required autofocus>
  </label>
  <label>Пароль
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Войти</button>
</form>
<div class="error" id="error" style="display: none;">Неверный логин или пароль</div>
<script>
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('error').style.display = 'block';
  }
</script>
</body>
</html>
