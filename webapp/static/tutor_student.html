<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Работа с учеником — Python Practice Hub</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
<style>
  .session-main { padding-block: var(--space-4); }
  .session-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: var(--space-4);
    align-items: start;
  }
  @media (max-width: 900px) {
    .session-layout { grid-template-columns: 1fr; }
  }
  .attempts-panel { max-height: 520px; overflow-y: auto; }
  .live-mount { min-height: 180px; }
  .live-mount .cm-editor { height: 100%; }
  .live-mount .cm-scroller { min-height: 180px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark">&lt;/&gt;</span> Python Practice Hub</div>
  <span class="chip" style="background: var(--c-primary-soft); color: var(--c-primary)">Репетитор</span>
  <div class="header-spacer"></div>
  <form id="impersonate-form" method="post" style="display: inline; margin: 0;">
    <button class="btn btn-sm" type="submit">Посмотреть как ученик</button>
  </form>
  <a class="btn btn-sm btn-ghost" href="/tutor">← к списку учеников</a>
</header>

<div class="container session-main">
  <div class="card card-pad row between wrap" id="call-bar" style="margin-bottom: var(--space-4)">
    <div class="stack stack-2">
      <h1 id="student-title" style="font-size: var(--fs-2xl); margin: 0">…</h1>
      <span class="muted" id="call-status">не в разговоре</span>
    </div>
    <div class="row" id="call-actions"></div>
  </div>
  <audio id="remote-audio" autoplay></audio>

  <div class="session-layout">
    <aside class="card card-pad stack stack-3 attempts-panel">
      <span class="panel-title">История попыток</span>
      <div id="attempts-rows" class="stack stack-2"></div>
      <p class="muted" id="attempts-empty" style="display: none">Попыток пока нет.</p>
    </aside>

    <main class="stack stack-4">
      <section class="stack stack-3">
        <div class="row between">
          <span class="panel-title">Код ученика сейчас</span>
          <span class="faint" style="font-size: var(--fs-sm)" id="student-live-status">ученик не печатает</span>
        </div>
        <div class="code-editor">
          <div class="code-editor-bar"><span>live, read-only</span></div>
          <div class="live-mount" id="student-mirror-mount"></div>
        </div>
      </section>

      <section class="stack stack-3">
        <div class="row between">
          <span class="panel-title">Ваша подсказка ученику</span>
          <span class="faint" style="font-size: var(--fs-sm)">видна ученику, пока вы онлайн</span>
        </div>
        <div class="code-editor">
          <div class="code-editor-bar"><span>hint.py</span></div>
          <div class="live-mount" id="hint-mount"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="/static/codemirror.bundle.js"></script>
<script src="/static/noise-suppressor.bundle.js"></script>
<script>
const studentId = Number(window.location.pathname.split('/').pop());
document.getElementById('impersonate-form').action = `/tutor/student/${studentId}/impersonate`;

const mirrorEditor = PracticeHubEditor.create(
  document.getElementById('student-mirror-mount'), '', null, {readOnly: true}
);

let hintSendTimer = null;
const hintEditor = PracticeHubEditor.create(
  document.getElementById('hint-mount'),
  '',
  (code) => {
    clearTimeout(hintSendTimer);
    hintSendTimer = setTimeout(() => sendMessage({code}), 300);
  }
);

async function loadAttempts() {
  const res = await fetch(`/api/students/${studentId}/attempts`);
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (res.status === 403 || res.status === 404) { window.location.href = '/tutor'; return; }
  const data = await res.json();
  document.getElementById('student-title').textContent = data.username;
  document.title = `${data.username} — Python Practice Hub`;

  const rows = document.getElementById('attempts-rows');
  document.getElementById('attempts-empty').style.display = data.attempts.length ? 'none' : 'block';
  rows.innerHTML = data.attempts.map((a, i) => `
    <details class="attempt-item">
      <summary class="attempt-row">
        <span>Задание ${a.task_id}</span>
        <span class="badge ${a.passed ? 'badge-pass' : 'badge-fail'}">${a.passed ? 'Пройдено' : 'Ошибки'}</span>
        <span class="muted">${a.created_at ? new Date(a.created_at).toLocaleString('ru-RU') : ''}</span>
      </summary>
      <div class="code-editor"><div class="attempt-code-mount" data-idx="${i}"></div></div>
    </details>
  `).join('');
  rows.querySelectorAll('details').forEach((details, i) => {
    details.addEventListener('toggle', () => {
      if (!details.open || details.dataset.mounted) return;
      details.dataset.mounted = '1';
      const mount = details.querySelector('.attempt-code-mount');
      PracticeHubEditor.create(mount, data.attempts[i].code, null, {readOnly: true});
    });
  });
}

let ws = null;
let studentTypingTimer = null;

function sendMessage(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
  }
}

function connectWs() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws/session/${studentId}`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'student_code') {
      mirrorEditor.setValue(msg.code || '');
      document.getElementById('student-live-status').textContent = 'ученик печатает';
      clearTimeout(studentTypingTimer);
      studentTypingTimer = setTimeout(() => {
        document.getElementById('student-live-status').textContent = 'ученик не печатает';
      }, 4000);
    } else if (msg.type === 'tutor_hint') {
      hintEditor.setValue(msg.code || '');
    } else if (msg.type === 'call_answer') {
      handleCallAnswer(msg);
    } else if (msg.type === 'call_ice') {
      handleRemoteIce(msg);
    } else if (msg.type === 'call_end') {
      endCall(false);
    }
  };

  ws.onclose = () => {
    setTimeout(connectWs, 2000);
  };
}

// --- Аудиозвонок (WebRTC, P2P) ---------------------------------------------
// Тьютор всегда звонящий: создаёт offer, ждёт answer. Сигналинг (offer/answer/
// ICE) идёт через тот же WebSocket, что и live-код/подсказки — отдельного
// канала/сервиса для этого не заводим.
let pc = null;
let localStream = null;
let noiseSuppressionCtx = null;
let pendingRemoteIce = [];
let callState = 'idle'; // idle | calling | in-call
let callTimeoutTimer = null;

const callStatusEl = document.getElementById('call-status');
const callActionsEl = document.getElementById('call-actions');
const remoteAudio = document.getElementById('remote-audio');

const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
const ICON_MIC_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';

// Прогоняет сырой поток микрофона через RNNoise (WASM, AudioWorklet) —
// шумоподавление сверх штатного echoCancellation/noiseSuppression браузера,
// которое на телефонах особенно слабое. При любой ошибке (нет AudioWorklet,
// не загрузился WASM) — тихо откатываемся на необработанный поток: рабочий
// звонок без шумодава лучше сорванного звонка.
async function applyNoiseSuppression(rawStream) {
  try {
    const audioCtx = new AudioContext({sampleRate: 48000});
    await audioCtx.audioWorklet.addModule('/static/rnnoise-worklet.js');
    const wasmBinary = await NoiseSuppressor.loadRnnoise({
      url: '/static/rnnoise.wasm',
      simdUrl: '/static/rnnoise_simd.wasm',
    });
    const source = audioCtx.createMediaStreamSource(rawStream);
    const rnnoiseNode = new NoiseSuppressor.RnnoiseWorkletNode(audioCtx, {maxChannels: 1, wasmBinary});
    const destination = audioCtx.createMediaStreamDestination();
    source.connect(rnnoiseNode).connect(destination);
    noiseSuppressionCtx = audioCtx;
    return destination.stream;
  } catch (e) {
    return rawStream;
  }
}

function renderCallBar() {
  if (callState === 'idle') {
    callStatusEl.textContent = 'не в разговоре';
    callActionsEl.innerHTML = `<button class="call-icon-btn is-accept" id="call-btn" title="Позвонить">${ICON_PHONE}</button>`;
    document.getElementById('call-btn').addEventListener('click', startCall);
  } else if (callState === 'calling') {
    callStatusEl.textContent = 'звоним ученику…';
    callActionsEl.innerHTML = `<button class="call-icon-btn is-hangup" id="hangup-btn" title="Отменить">${ICON_PHONE}</button>`;
    document.getElementById('hangup-btn').addEventListener('click', () => endCall(true));
  } else if (callState === 'in-call') {
    callStatusEl.textContent = 'в разговоре';
    const muted = localStream && !localStream.getAudioTracks()[0].enabled;
    callActionsEl.innerHTML = `
      <button class="call-icon-btn is-mute${muted ? ' is-active' : ''}" id="mute-btn" title="${muted ? 'Включить микрофон' : 'Выключить микрофон'}">${muted ? ICON_MIC_OFF : ICON_MIC}</button>
      <button class="call-icon-btn is-hangup" id="hangup-btn" title="Завершить звонок">${ICON_PHONE}</button>
    `;
    document.getElementById('mute-btn').addEventListener('click', toggleMute);
    document.getElementById('hangup-btn').addEventListener('click', () => endCall(true));
  }
}

async function fetchIceServers() {
  const res = await fetch('/api/turn-credentials');
  const data = await res.json();
  return data.iceServers;
}

// Явно просим у браузера подавление эха/шума и автогейн — без этого
// поведение по умолчанию отличается между браузерами и версиями. Микрофон
// у нас всегда моно, так что просим конкретный формат захвата, а не
// дефолтный (браузер может занизить sampleRate до подключения обработки).
const AUDIO_CONSTRAINTS = {
  echoCancellation: true,
  noiseSuppression: true,
  autoGainControl: true,
  channelCount: 1,
  sampleRate: 48000,
  sampleSize: 16,
};

// Дефолтный битрейт Opus в "голосовом" профиле довольно низкий — поднимаем
// потолок, качество звонка это заметно улучшает.
function boostAudioBitrate(peerConnection) {
  const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
  if (!sender) return;
  const params = sender.getParameters();
  if (!params.encodings || !params.encodings.length) params.encodings = [{}];
  params.encodings[0].maxBitrate = 128000;
  sender.setParameters(params).catch(() => {});
}

// setParameters() выше не всегда доезжает до энкодера так же надёжно, как
// явные fmtp-параметры в самом SDP — здесь же включаем FEC (восстановление
// потерянных пакетов без переспроса, слышно как меньше "заикания" на плохой
// сети) и явно выключаем DTX (экономит трафик на паузах ценой лёгких
// щелчков/провалов на входе-выходе из тишины — для качества это того не стоит).
function tuneOpusSdp(sdp) {
  const rtpmap = sdp.match(/a=rtpmap:(\d+) opus\/48000/);
  if (!rtpmap) return sdp;
  const pt = rtpmap[1];
  const desired = ['minptime=10', 'useinbandfec=1', 'usedtx=0', 'maxaveragebitrate=128000'];
  const fmtpRe = new RegExp(`a=fmtp:${pt} ([^\r\n]*)`);
  if (fmtpRe.test(sdp)) {
    return sdp.replace(fmtpRe, (line, params) => {
      const kept = params.split(';').filter(p => p && !/^(minptime|useinbandfec|usedtx|maxaveragebitrate)=/.test(p));
      return `a=fmtp:${pt} ${kept.concat(desired).join(';')}`;
    });
  }
  return sdp.replace(rtpmap[0], `${rtpmap[0]}\r\na=fmtp:${pt} ${desired.join(';')}`);
}

function setupPeerConnection(iceServers) {
  const conn = new RTCPeerConnection({iceServers});
  conn.onicecandidate = (e) => {
    if (e.candidate) sendMessage({type: 'call_ice', candidate: e.candidate});
  };
  conn.ontrack = (e) => { remoteAudio.srcObject = e.streams[0]; };
  conn.onconnectionstatechange = () => {
    if (conn.connectionState === 'connected') {
      clearTimeout(callTimeoutTimer);
      callState = 'in-call';
      renderCallBar();
    } else if (conn.connectionState === 'failed' || conn.connectionState === 'disconnected') {
      endCall(true);
    }
  };
  return conn;
}

async function startCall() {
  if (callState !== 'idle') return;
  callState = 'calling';
  renderCallBar();
  try {
    const iceServers = await fetchIceServers();
    localStream = await navigator.mediaDevices.getUserMedia({audio: AUDIO_CONSTRAINTS});
    const outgoingStream = await applyNoiseSuppression(localStream);
    pc = setupPeerConnection(iceServers);
    outgoingStream.getTracks().forEach(t => pc.addTrack(t, outgoingStream));
    boostAudioBitrate(pc);
    const offer = await pc.createOffer();
    offer.sdp = tuneOpusSdp(offer.sdp);
    await pc.setLocalDescription(offer);
    sendMessage({type: 'call_offer', sdp: offer});
    callTimeoutTimer = setTimeout(() => {
      if (callState === 'calling') {
        callStatusEl.textContent = 'ученик не отвечает';
        endCall(true);
      }
    }, 30000);
  } catch (e) {
    callStatusEl.textContent = 'не удалось включить микрофон';
    endCall(false);
  }
}

async function handleCallAnswer(msg) {
  if (!pc) return;
  await pc.setRemoteDescription(msg.sdp);
  for (const candidate of pendingRemoteIce) {
    await pc.addIceCandidate(candidate);
  }
  pendingRemoteIce = [];
}

async function handleRemoteIce(msg) {
  if (pc && pc.remoteDescription) {
    await pc.addIceCandidate(msg.candidate);
  } else {
    pendingRemoteIce.push(msg.candidate);
  }
}

function toggleMute() {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  renderCallBar();
}

function endCall(notify) {
  clearTimeout(callTimeoutTimer);
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (noiseSuppressionCtx) { noiseSuppressionCtx.close(); noiseSuppressionCtx = null; }
  pendingRemoteIce = [];
  remoteAudio.srcObject = null;
  if (notify) sendMessage({type: 'call_end'});
  callState = 'idle';
  renderCallBar();
}

renderCallBar();
loadAttempts();
connectWs();
</script>
</body>
</html>
