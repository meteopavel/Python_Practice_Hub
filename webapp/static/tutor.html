<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ученики — Python Practice Hub</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
<style>
  .tutor-main { padding-block: var(--space-4); }
  .student-row { cursor: pointer; }
  .student-row:hover { background: var(--c-surface-2); }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark">&lt;/&gt;</span> Python Practice Hub</div>
  <a class="btn btn-sm btn-ghost" href="/tutor/hints">Подсказки</a>
  <div class="header-spacer"></div>
  <details class="account-menu">
    <summary class="account-trigger">
      <span class="muted" id="username"></span>
      <span class="avatar" id="avatar"></span>
    </summary>
    <div class="account-menu-panel">
      <form method="post" action="/logout" style="margin: 0">
        <button class="account-menu-item" type="submit">Выйти</button>
      </form>
    </div>
  </details>
</header>

<div class="container tutor-main">
  <div class="stack stack-2" style="margin-bottom: var(--space-4)">
    <h1 style="font-size: var(--fs-2xl)">Ученики</h1>
    <p class="muted">Выберите ученика, чтобы посмотреть его попытки и поработать с ним вживую</p>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr><th>Ученик</th><th>Попыток</th><th class="col-right">Последняя активность</th><th class="col-right"></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="muted" id="empty-state" style="display: none; margin-top: var(--space-4)">Пока нет ни одного ученика.</p>

  <div class="card card-pad stack stack-3" style="margin-top: var(--space-4)">
    <div class="row between">
      <span class="panel-title">Новый ученик</span>
      <button class="btn btn-sm" id="add-student-toggle">Добавить ученика</button>
    </div>
    <form id="add-student-form" class="row wrap" style="display: none; gap: var(--space-3); align-items: flex-end;">
      <div class="field" style="flex: 1; min-width: 160px">
        <label class="label" for="new-username">Логин</label>
        <input class="input" id="new-username" required>
      </div>
      <div class="field" style="flex: 1; min-width: 160px">
        <label class="label" for="new-password">Пароль</label>
        <input class="input" id="new-password" type="password" required>
      </div>
      <button class="btn btn-primary btn-sm" type="submit">Создать</button>
    </form>
    <p class="field-error" id="add-student-error" style="display: none; margin: 0"></p>
  </div>
</div>

<script>
function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value === undefined ? '' : String(value);
  return div.innerHTML;
}

function initials(name) {
  return (name || '?').slice(0, 2).toUpperCase();
}

async function loadMe() {
  const res = await fetch('/api/me');
  if (res.status === 401) { window.location.href = '/login'; return; }
  const data = await res.json();
  document.getElementById('username').textContent = data.username || '';
  document.getElementById('avatar').textContent = initials(data.username);
}

async function load() {
  const res = await fetch('/api/students');
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (res.status === 403) { window.location.href = '/'; return; }
  const students = await res.json();

  document.getElementById('empty-state').style.display = students.length ? 'none' : 'block';
  document.getElementById('rows').innerHTML = students.map(s => `
    <tr class="student-row" data-id="${s.id}">
      <td><span class="avatar">${initials(s.username)}</span>${escapeHtml(s.username)}</td>
      <td class="num muted">${s.attempts_count}</td>
      <td class="col-right num muted">${s.last_attempt_at ? new Date(s.last_attempt_at).toLocaleString('ru-RU') : '—'}</td>
      <td class="col-right"><button class="btn btn-sm btn-ghost reset-pw-btn" data-id="${s.id}" data-username="${escapeHtml(s.username)}">Сменить пароль</button></td>
    </tr>
  `).join('');

  document.querySelectorAll('.student-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      window.location.href = `/tutor/student/${row.dataset.id}`;
    });
  });
}

document.getElementById('rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('.reset-pw-btn');
  if (!btn) return;
  e.stopPropagation();
  const newPassword = prompt(`Новый пароль для ${btn.dataset.username}:`);
  if (!newPassword) return;
  const res = await fetch(`/api/students/${btn.dataset.id}/password`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: newPassword}),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'Не удалось сменить пароль'); return; }
  alert('Пароль обновлён');
});

document.getElementById('add-student-toggle').addEventListener('click', () => {
  const form = document.getElementById('add-student-form');
  form.style.display = form.style.display === 'none' ? 'flex' : 'none';
});

document.getElementById('add-student-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('add-student-error');
  errorEl.style.display = 'none';
  const usernameEl = document.getElementById('new-username');
  const passwordEl = document.getElementById('new-password');
  const res = await fetch('/api/students', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: usernameEl.value.trim(), password: passwordEl.value}),
  });
  const data = await res.json();
  if (!res.ok) {
    errorEl.textContent = data.error || 'Не удалось создать ученика';
    errorEl.style.display = 'block';
    return;
  }
  usernameEl.value = '';
  passwordEl.value = '';
  document.getElementById('add-student-form').style.display = 'none';
  load();
});

document.addEventListener('click', (e) => {
  document.querySelectorAll('details.account-menu[open]').forEach(d => {
    if (!d.contains(e.target)) d.removeAttribute('open');
  });
});

loadMe();
load();
</script>
</body>
</html>
