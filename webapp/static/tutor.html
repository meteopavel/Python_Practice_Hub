<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ученики — Python Practice Hub</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  .tutor-main { padding-block: var(--space-5); }
  .student-row { cursor: pointer; }
  .student-row:hover { background: var(--c-surface-2); }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark">&lt;/&gt;</span> Python Practice Hub</div>
  <span class="chip" style="background: var(--c-primary-soft); color: var(--c-primary)">Репетитор</span>
  <div class="header-spacer"></div>
  <a class="btn btn-sm btn-ghost" href="/">← к проверке кода</a>
</header>

<div class="container tutor-main">
  <div class="stack stack-2" style="margin-bottom: var(--space-5)">
    <h1 style="font-size: var(--fs-2xl)">Ученики</h1>
    <p class="muted">Выберите ученика, чтобы посмотреть его попытки и поработать с ним вживую</p>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr><th>Ученик</th><th>Попыток</th><th class="col-right">Последняя активность</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="muted" id="empty-state" style="display: none; margin-top: var(--space-4)">Пока нет ни одного ученика.</p>
</div>

<script>
function initials(name) {
  return (name || '?').slice(0, 2).toUpperCase();
}

async function load() {
  const res = await fetch('/api/students');
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (res.status === 403) { window.location.href = '/'; return; }
  const students = await res.json();

  document.getElementById('empty-state').style.display = students.length ? 'none' : 'block';
  document.getElementById('rows').innerHTML = students.map(s => `
    <tr class="student-row" data-id="${s.id}">
      <td><span class="avatar">${initials(s.username)}</span>${s.username}</td>
      <td class="num muted">${s.attempts_count}</td>
      <td class="col-right num muted">${s.last_attempt_at ? new Date(s.last_attempt_at).toLocaleString('ru-RU') : '—'}</td>
    </tr>
  `).join('');

  document.querySelectorAll('.student-row').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = `/tutor/student/${row.dataset.id}`;
    });
  });
}

load();
</script>
</body>
</html>
