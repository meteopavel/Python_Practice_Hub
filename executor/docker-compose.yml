services:
  executor:
    build: .
    restart: unless-stopped
    # Публикуем ТОЛЬКО на адрес тоннеля (awg0, 10.0.0.1) — снаружи (LAN,
    # интернет) этот порт не виден вообще, достучаться можно только со
    # стороны Frankfurt через WireGuard.
    ports:
      - "10.0.0.1:8010:8010"
    # Фиксированная подсеть — нужна, чтобы правило в DOCKER-USER (см. ниже)
    # ссылалось на конкретный CIDR, а не на то, что Docker выдаст случайно
    # при пересборке.
    networks:
      default:
        ipv4_address: 172.28.55.2
    # Файловая система только на чтение — код ученика не может ничего
    # изменить/оставить после себя. /tmp — единственное писаемое место
    # (туда sandbox.py кладёт временный файл с кодом), в памяти, не на диске.
    read_only: true
    tmpfs:
      - /tmp
    # Урезаем то, что обычно не нужно контейнеру веб-сервиса вообще.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    environment:
      - PYTHONDONTWRITEBYTECODE=1

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.55.0/24

# Исходящая сеть режется НЕ здесь, а отдельным правилом в цепочке
# DOCKER-USER на хосте (роутере) — Docker специально резервирует эту
# цепочку для ручных ограничений и не трогает её при своих перезапусках:
#
#   iptables -I DOCKER-USER -s 172.28.55.0/24 -m conntrack --ctstate NEW -j DROP
#
# Блокирует НОВЫЕ соединения из этой подсети наружу (то, что открыл ученик
# через socket.create_connection в PoC), не трогая уже установленные —
# то есть ответ Frankfurt на его же входящий запрос продолжает проходить.
